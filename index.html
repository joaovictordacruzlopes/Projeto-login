<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C&A/Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mediaquery.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    

</head>
<body>
    <main>
        <section id="login-section">
           <div id="imagem">

           </div>

           <div id="formulario">
               <h1>Login</h1>
               <p> Seja bem-vindo(a) novamente. faça login para acessar sua conta e poder fazer as configurações em seu ambiente.</p>
                <form action="login.php" method="post" autocomplete="on">
                    <div class="campo">
                    <span class="material-symbols-outlined">login</span>
                     <input type="email"name="email" id="ilogin" placeholder="Digite seu e-mail" required autocomplete="email" maxlength="28">
                      <label for="ilogin">Login</label>
                    </div>

                    <div class="campo">
                    <span class="material-symbols-outlined">key</span>
                    <input type="password" name="senha" id="isenha" placeholder="Digite sua senha" required autocomplete="current-password" minlength="5" maxlength="8">
                    <label for="isenha">Senha</label>
                    </div>
                    <input type="submit" value="Entrar">
                    <a class="botao" href="esqueci.html">Esqueci a senha <span class="material-symbols-outlined">mail</span> </a>
                </form>


             
                  
           </div>

        </section>
    </main>
    
</body>
</html>
